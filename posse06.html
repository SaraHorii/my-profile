<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-lg shadow p-8 w-full max-w-sm">
     <h1 class="text-2xl font-bold mb-10 text-center">BMI計算ツール</h1>

     <div class="flex justify-center mb-4">
      <label class="block font-medium text-gray-700 mt-2">身長(cm)</label>
      <input id="height" type="number" placeholder="例：170" 
        class="border border-gray-300 rounded px-3 py-2">    
     </div>

     <div class="flex justify-center mb-10">
      <label class="block font-medium text-gray-700 mt-2">体重(kg)</label>
      <input id="weight" type="number" placeholder="例：65" 
        class="border border-gray-300 rounded px-3 py-2">
     </div>

     <button id="calcBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">計算する</button>

     <p id="result" class="mt-6 text-center text-lg font-bold"></p>
    </div>

    <script>
        function calcBmi(height, weight) {
            const heightM = height / 100;
            return weight / (heightM * heightM);
        }

        function getJudgment(bmi) {
            let judgment = "";

            if (bmi < 18.5) {
                judgment = "痩せ型";
            } else if (bmi < 25) {
                judgment = "普通";
            } else {
                judgment = "肥満";
            }

            return judgment;
        }

        const button = document.querySelector("#calcBtn");
        const result = document.querySelector("#result");

        button.addEventListener("click", () => {
            const height = Number(document.querySelector("#height").value);
            const weight = Number(document.querySelector("#weight").value);

            if (height <= 0 || weight <= 0) {
                result.textContent = "上のマスに身長と体重の数値を入力してください";
                return;
            }

            const bmi = calcBmi(height, weight);
            const judgment = getJudgment(bmi);

            result.textContent = "BMI: " + bmi.toFixed(1) + "(" + judgment + ")";
        });
    </script>

</body>
</html>
