<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インターアクト同好会</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">

    <header class="bg-gray-800 shadow px-6 py-4">
      <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <h1 class="text-xl font-bold text-white">インターアクト同好会</h1>
        <nav class="flex flex-col md:flex-row gap-2 md:gap-6 text-sm text-right">
          <a href="#" class="text-gray-400 hover:text-white">ホーム</a>
          <a href="#" class="text-gray-400 hover:text-white">活動内容</a>
          <a href="#" class="text-gray-400 hover:text-white">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">

      <section class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">共に社会を生きる。</h2>
        <p class="text-gray-600 hidden md:block">私たちはボランティア活動を通じて、人と人との繋がりを大切にします。</p>
      </section>

      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">活動内容</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🤱</p>
            <h3 class="font-bold">学童保育</h3>
            <p class="text-gray-500 text-sm mt-1 hidden md:block">母子ホームの訪問を年25回実施しています。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🏖️</p>
            <h3 class="font-bold">ビーチクリーン</h3>
            <p class="text-gray-500 text-sm mt-1 hidden md:block">2ヶ月に1回、近くの海岸でゴミ拾いを行っています。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">♻️</p>
            <h3 class="font-bold">リサイクル推進</h3>
            <p class="text-gray-500 text-sm mt-1 hidden md:block">コンタクトレンズのクリアケースを回収します。</p>
          </div>
        </div>
      </section>

    </main>

    <footer class="bg-gray-800 text-gray-400 text-sm text-center py-6">
      &copy; 2026 インターアクト同好会 
    </footer>

  </body>
</html>
