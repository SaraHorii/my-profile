<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介カード</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 py-8">
    <header class="fixed top-0 left-0 w-full bg-yellow-300 border-b z-50 flex items-center justify-center px-6 py-4">
      <h1 class="text-2xl font-bold">忍たま乱太郎</h1>
    </header>
    <main class="max-w-4xl mx-auto px-4 mt-16">
      <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">乱・きり・しん</h1>

      <div class="flex flex-col md:flex-row gap-6">

        <div class="bg-blue-300 rounded-lg shadow p-6 flex flex-col items-center">
          <img src="スクリーンショット 2026-06-09 21.41.18.png" alt="猪名寺乱太郎の写真です。" class="w-50 h-50 object-cover rounded-full">
          <h2 class="text-lg font-bold text-gray-900 mt-3">猪名寺乱太郎</h2>
          <p class="text-gray-600 text-sm mt-2 text-center">保健委員会所属 絵を描くのが得意。</p>
        </div>

        <div class="bg-blue-300 rounded-lg shadow p-6 flex flex-col items-center">
          <img src="スクリーンショット 2026-06-09 21.41.32.png" alt="摂津のきり丸の写真です。" class="w-50 h-50 object-cover rounded-full">
          <h2 class="text-lg font-bold text-gray-900 mt-3">摂津のきり丸</h2>
          <p class="text-gray-600 text-sm mt-2 text-center">図書委員会所属 小銭が大好き。</p>
        </div>

        <div class="bg-blue-300 rounded-lg shadow p-6 flex flex-col items-center">
          <img src="スクリーンショット 2026-06-09 21.41.41.png" alt="福富しんべヱの写真です。" class="w-50 h-50 object-cover rounded-full">
          <h2 class="text-lg font-bold text-gray-900 mt-3">福富しんべヱ</h2>
          <p class="text-gray-600 text-sm mt-2 text-center">用具委員会所属 大の食いしん坊。</p>
        </div>

      </div>
    </main>
  </body>
</html>
